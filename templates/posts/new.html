{% extends 'base.html' %}
{% load static %}

{% block css%}
  <link rel="stylesheet" href="{% static 'css/new.css' %}">
{% endblock %}

{% block title %}
  Create New Posts
{% endblock %}

{% block content %}
  <h1 class="text-center">Create New Post</h1>
  <form class="mt-5" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Create" class="btn btn-success">
  </form>
{% endblock %}
